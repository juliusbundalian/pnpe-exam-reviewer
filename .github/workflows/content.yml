name: Content toolchain
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:emulator
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/pnpe-emulator-no-adc.json
# Proprietary PDFs are not present in CI. Reference acceptance is a separate,
# mandatory local command with supplied PDFs, never a silently skipped test.
